name: splitpot-dev

services:
  db:
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      target: development
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    command: ["sh", "scripts/dev.sh"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    init: true
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
