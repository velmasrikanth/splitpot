name: splitpot-prod

services:
  db:
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    init: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "${HTTP_PORT}:8080"
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
