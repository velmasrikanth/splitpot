name: splitpot-test

services:
  db:
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    build:
      target: development
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && npm test"]

  frontend-test:
    profiles: ["frontend"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    command: ["npm", "test"]
    init: true
